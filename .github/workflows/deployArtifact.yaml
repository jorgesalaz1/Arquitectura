name: Deploy artifact

on:
  repository_dispatch:
    types: [deploy-artifact-event]

jobs:
  dowload-artifact-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:

      ########################################################
      # 1- Retrieve parameters from payload
      ########################################################
      - name: Retrieve Payload
        run: |
          echo ${{ github.event.client_payload.checksum }}

      ########################################################
      # 2- Download Artifact
      ########################################################
      - uses: dawidd6/action-download-artifact@v2
        id: download-artifact
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: publishJarAsArtifact.yaml
          workflow_conclusion: success
          name: artifactjar
          path: /tmp/artifactjar

      - name: Display downloaded files
        run: ls -R /tmp/artifactjar

      ########################################################
      # 3- Verify checksum
      ########################################################
      - name: Calculate checksum
        run: |
          echo "HASH=$(sha1sum /tmp/artifactjar/${{ github.event.client_payload.artifact_name }} | awk '{print $1}')" >> $GITHUB_ENV

      - name: Compare checksum
        run: |
          if [ "${{ env.HASH }}" == "${{ github.event.client_payload.checksum }}" ]; then
            echo "Checksum OK"
          else
            echo "Checksum ERROR"
            exit 1
          fi

      ########################################################
      # 4- Prepare Docker Context
      ########################################################
      - uses: actions/checkout@v4

      - name: Prepare Docker Context
        run: |
          cp Arquitectura/Dockerfile /tmp/Dockerfile
          cp /tmp/artifactjar/${{ github.event.client_payload.artifact_name }} /tmp/${{ github.event.client_payload.artifact_name }}

      - name: Upload Docker Context
        uses: actions/upload-artifact@v4
        with:
          name: dockerBuildContext
          path: |
            /tmp/Dockerfile
            /tmp/${{ github.event.client_payload.artifact_name }}

  docker-job:

    needs: dowlonad-artifact-job

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

    steps:

      ########################################################
      # Docker
      ########################################################
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ########################################################
      # Azure Login
      ########################################################
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ########################################################
      # Login ACR
      ########################################################
      - name: Login Azure Container Registry
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      ########################################################
      # Download Docker Context
      ########################################################
      - name: Download Docker Context
        uses: actions/download-artifact@v4
        with:
          name: dockerBuildContext
          path: ./dockerBuildContext

      - name: Show Docker Context
        run: ls -R dockerBuildContext

      ########################################################
      # Build and Push Image
      ########################################################
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./dockerBuildContext
          file: ./dockerBuildContext/Dockerfile
          push: true
          build-args: |
            JAR_FILE=${{ github.event.client_payload.artifact_name }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          tags: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/customer-back:${{ github.sha }}

      ########################################################
      # Deploy Azure Container Apps
      ########################################################
      - name: Deploy Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.AZURE_ACR_NAME }}.azurecr.io/customer-back:${{ github.sha }}