name: Publish Jar as Artifact

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-artifact-event]
  push:
    branches:
      - develop

jobs:
  download-artifact-job:
    runs-on: ubuntu-latest

    env:
      ARTIFACT_NAME: 'Arquitectura-0.0.1-SNAPSHOT.jar'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Debug Payload
        run: |
          echo "Workflow iniciado"

      - uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 0

      - name: check last hashid
        run: |
          git log -2

      - name: setup java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache local Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: build with maven
        working-directory: ./Arquitectura
        run: |
          mvn clean package -DskipTests=true --batch-mode --update-snapshots
          ls -R target/
          ls -la

      - name: Publish Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: artifactjar
          path: ${{ github.workspace }}/Arquitectura/target/${{ env.ARTIFACT_NAME }}